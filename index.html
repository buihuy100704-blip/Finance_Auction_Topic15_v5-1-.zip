<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance Auction — Topic 15</title>
<style>
:root{--gold:#f5c542;--gold2:#b8860b;--navy:#0a1a6b;--deep:#050a33;--ok:#1fa35b;--bad:#d6393f;--org:#ff8a1f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font-family:"Avenir Next","Trebuchet MS",sans-serif;
background:radial-gradient(ellipse at 50% -10%,#3a2bb0 0,#13207f 35%,var(--deep) 75%) fixed}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 28px}
header h1{margin:0;font-size:26px;letter-spacing:.5px}header small{color:#b9c2ff}
.wrap{max-width:1180px;margin:auto;padding:8px 22px 40px}
.hidden{display:none!important}
.panel{background:rgba(8,14,70,.75);border:2px solid var(--gold);border-radius:22px;padding:22px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 320px;gap:20px}
.pill{display:inline-block;background:#1a2a9c;border:1px solid #4b5cf0;border-radius:999px;padding:6px 14px;margin-right:8px;font-weight:700}
.hex{clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0 50%)}
.qbox{position:relative;background:linear-gradient(var(--gold),var(--gold2));padding:3px;margin:18px 0}
.qbox>div{background:linear-gradient(#0d1a8c,#060f55);padding:26px 8%;text-align:center;font-size:24px;line-height:1.4;clip-path:inherit}
.qbox b{display:block;color:var(--gold);font-size:15px;margin-bottom:6px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{all:unset;box-sizing:border-box;cursor:pointer;clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0 50%);background:linear-gradient(var(--gold),var(--gold2));padding:3px;display:block}
.ans span{display:flex;gap:12px;align-items:center;padding:16px 7%;font-size:18px;font-weight:700;background:linear-gradient(#0d1a8c,#060f55);clip-path:inherit;min-height:64px}
.ans i{font-style:normal;color:var(--org);font-weight:900}
.ans:hover:not([disabled]) span{background:linear-gradient(#ff9d3a,#e06a00)}
.ans:hover:not([disabled]) i{color:#fff}
.ans:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ans[disabled]{cursor:default;opacity:1}
.ans.ok span{background:linear-gradient(#27c774,var(--ok))}.ans.ok i{color:#fff}
.ans.bad span{background:linear-gradient(#ee5a60,var(--bad))}.ans.bad i{color:#fff}
button.ans.dim:disabled{opacity:.4}
.result{text-align:center;font-size:30px;font-weight:900;padding:14px;border-radius:16px;margin-top:16px;animation:pop .35s ease}
.result.ok{background:var(--ok)}.result.bad{background:var(--bad)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.result{animation:none}}
.bidnow{font-size:44px;font-weight:900;color:var(--gold)}
.bids{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button.chip,.ctl button{border:0;border-radius:999px;padding:12px 20px;font-size:17px;font-weight:800;cursor:pointer;background:var(--gold);color:#2a1d00}
button.chip:hover:not(:disabled){background:#fff}
button:disabled{opacity:.3;cursor:not-allowed}
.ctl button{background:#4b5cf0;color:#fff;margin:4px}.ctl .sold{background:var(--org)}.ctl .rst{background:#2a2f63}
.muted{color:#b9c2ff}
.bal{font-size:44px;font-weight:900;color:var(--gold)}
.row{display:flex;justify-content:space-between;padding:9px 12px;border-radius:10px}
.row.me{background:var(--org);color:#1c0f00;font-weight:800}
.row:nth-child(1) b{color:var(--gold)}
input{width:100%;padding:14px;margin:6px 0 14px;border-radius:12px;border:2px solid #4b5cf0;background:#060f55;color:#fff;font-size:17px}
.join{max-width:480px;margin:40px auto}
.join button{margin:4px 6px 0 0}
@media(max-width:860px){.grid,.answers{grid-template-columns:1fr}.qbox>div{font-size:19px}}
</style></head><body>
<header><div><h1>💰 Finance Auction</h1><small>Topic 15 · Who wants to be a finance millionaire?</small></div><div id="status">Offline</div></header>
<div class="wrap">
<section id="join" class="panel join">
<h2>Join the game</h2>
<label for="room">Room code</label><input id="room" value="FA2026">
<label for="name">Nickname</label><input id="name" placeholder="Your name">
<button class="chip" onclick="join()">Join as student</button>
<button class="chip" style="background:#4b5cf0;color:#fff" onclick="host()">Open host dashboard</button>
</section>
<section id="game" class="hidden"><div class="grid"><main>
<div class="panel">
<span class="pill" id="round"></span><span class="pill" id="phase"></span>
<div class="qbox hex"><div id="question">Waiting for host…</div></div>
<div id="answers" class="answers"></div>
<div id="result"></div>
</div>
<div class="panel" id="auctionCard"><h2 style="margin-top:0">🔨 Auction</h2>
<div class="muted">Highest bid</div><div class="bidnow" id="bid">$0</div>
<div>Highest bidder: <b id="bidder">—</b></div>
<div class="bids" id="bidButtons"></div></div>
<div class="panel ctl hidden" id="hostCard"><h2 style="margin-top:0">👨‍🏫 Host controls</h2>
<button onclick="send('open_auction')">Open auction</button>
<button class="sold" onclick="send('sold')">🔨 Sold</button>
<button onclick="send('next_round')">Next round</button>
<button class="rst" onclick="if(confirm('Reset the whole game?'))send('reset')">Reset game</button>
<p class="muted">Answers are graded automatically when the winner picks one.</p></div>
</main><aside>
<div class="panel"><div class="muted">Your balance</div><div class="bal" id="balance">$1,000</div><div id="stats"></div></div>
<div class="panel"><h3 style="margin-top:0">🏆 Leaderboard</h3><div id="players"></div></div>
</aside></div></section></div>
<script src="/app.js"></script></body></html>
